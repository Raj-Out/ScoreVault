server.port=${PORT:8080}
spring.application.name=scorevault

# Azure SQL connection is supplied by the developer. Example:
# jdbc:sqlserver://<server>.database.windows.net:1433;database=<database>;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=120
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:scorevault_app}
spring.datasource.password=${DB_PASSWORD}
# The free serverless database may be paused: allow a long first connection and keep no idle connections.
spring.datasource.hikari.connection-timeout=120000
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
# Schema and seed scripts are managed explicitly in database/; do not auto-run SQL init at app startup.
spring.sql.init.mode=never

# JWT signing secret also comes from the environment (at least 32 characters).
scorevault.jwt.secret=${JWT_SECRET}
scorevault.jwt.ttl-minutes=120

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.default-property-inclusion=non_null

# Private participant submissions use the App Service managed identity. No storage keys belong here.
scorevault.storage.account-url=${AZURE_STORAGE_ACCOUNT_URL:}
scorevault.storage.container=${AZURE_STORAGE_CONTAINER:participant-submissions}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
