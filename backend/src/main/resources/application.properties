server.port=8080
spring.application.name=scorevault

# Azure SQL Database. The password is NEVER stored here: it comes from the DB_PASSWORD environment variable.
spring.datasource.url=jdbc:sqlserver://scorevault-prince-sql.database.windows.net:1433;database=scorevault-db;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=120
spring.datasource.username=scoreadmin
spring.datasource.password=${DB_PASSWORD}
# The free serverless database may be paused: allow a long first connection and keep no idle connections.
spring.datasource.hikari.connection-timeout=120000
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5

# JWT signing secret also comes from the environment (at least 32 characters).
scorevault.jwt.secret=${JWT_SECRET}
scorevault.jwt.ttl-minutes=120

server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.default-property-inclusion=non_null
