<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leaderboard · ScoreVault</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body data-page="leaderboard">
  <header class="site-header">
    <a class="brand" href="/" aria-label="ScoreVault home"><span class="brand-mark">S</span><span>ScoreVault</span></a>
    <nav class="main-nav" aria-label="Main navigation"><a class="current" href="/leaderboard.html">Leaderboard</a><a href="/judging.html">Judge scoring</a><a href="/admin.html">Admin</a><a href="/submissions.html">My team</a></nav>
    <div class="account-area"><span id="account-name"></span><a class="button button-small" id="sign-in-link" href="/login.html">Sign in</a><button class="button button-small button-quiet" id="logout-button" type="button" hidden>Sign out</button></div>
  </header>
  <main class="page-shell">
    <div class="page-heading"><div><p class="eyebrow">Published results</p><h1>Leaderboard</h1><p class="muted">Choose a round to view its current rankings.</p></div></div>
    <section class="panel controls-row">
      <label for="leaderboard-round">Round</label>
      <select id="leaderboard-round" aria-describedby="leaderboard-status"><option value="">Loading rounds…</option></select>
      <button id="refresh-leaderboard" class="button button-secondary" type="button">Refresh</button>
      <span id="leaderboard-status" class="form-message" role="status" aria-live="polite"></span>
    </section>
    <section class="panel table-panel" aria-label="Round rankings">
      <div id="leaderboard-table-container"><p class="muted">Loading results…</p></div>
    </section>
  </main>
</body>
</html>
