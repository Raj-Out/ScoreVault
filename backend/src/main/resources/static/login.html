<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · ScoreVault</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body data-page="login">
  <header class="site-header">
    <a class="brand" href="/" aria-label="ScoreVault home"><span class="brand-mark">S</span><span>ScoreVault</span></a>
    <nav class="main-nav" aria-label="Main navigation"><a href="/leaderboard.html">Leaderboard</a><a href="/judging.html">Judge scoring</a><a href="/admin.html">Admin</a><a href="/submissions.html">My team</a></nav>
    <div class="account-area"><span id="account-name"></span><button class="button button-small button-quiet" id="logout-button" type="button" hidden>Sign out</button></div>
  </header>
  <main class="page-shell narrow-shell">
    <section class="panel">
      <p class="eyebrow">Your workspace</p>
      <h1>Sign in to ScoreVault</h1>
      <p class="muted">Sign in with Google or use an existing ScoreVault account.</p>
      <div id="google-signin" class="form-stack" aria-label="Google sign-in">
        <div id="google-button"></div>
        <p id="google-status" class="form-message" role="status" aria-live="polite"></p>
        <form id="google-profile-form" class="form-stack" hidden>
          <label for="google-affiliation">School or organization</label>
          <input id="google-affiliation" name="affiliation" type="text" maxlength="200" autocomplete="organization">
          <button id="google-profile-submit" class="button" type="submit">Create participant account</button>
        </form>
        <p class="muted">New Google accounts join as participants. Ask an administrator to assign judge or admin access.</p>
      </div>
      <p class="muted">Or sign in with your ScoreVault account</p>
      <form id="login-form" class="form-stack">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
        <label for="password">Password</label>
        <div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" required><button class="password-toggle" type="button" aria-controls="password" aria-pressed="false">Show</button></div>
        <button id="login-button" class="button" type="submit">Sign in</button>
        <p id="login-status" class="form-message" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</body>
</html>
