<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>ScoreVault — Secure Login & Authentication</title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            surface: "#08122d",
            "surface-dim": "#08122d",
            "surface-container-lowest": "#030c28",
            "surface-container-low": "#111a36",
            "surface-container": "#151e3a",
            "surface-container-high": "#202945",
            "surface-container-highest": "#2b3450",
            primary: "#4cd7f6",
            "primary-container": "#06b6d4",
            "on-primary": "#003640",
            secondary: "#4edea3",
            "secondary-container": "#00a572",
            "on-secondary": "#003824",
            tertiary: "#ffb95f",
            outline: "#869397",
            "on-surface": "#dbe1ff",
            "on-surface-variant": "#bcc9cd"
          },
          fontFamily: {
            sans: ["Inter", "sans-serif"],
            mono: ["JetBrains Mono", "monospace"]
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #08122d;
      color: #dbe1ff;
      font-family: 'Inter', sans-serif;
    }
    .glow-cyan {
      box-shadow: 0 0 35px -5px rgba(76, 215, 246, 0.25);
    }
    .glow-emerald {
      box-shadow: 0 0 25px -5px rgba(78, 222, 163, 0.2);
    }
  </style>
</head>
<body class="min-h-screen bg-surface flex flex-col justify-between selection:bg-primary/30 selection:text-primary">
  <!-- Header / Navigation Bar -->
  <header class="h-16 px-6 sm:px-10 flex items-center justify-between border-b border-surface-container-high/60 bg-surface-container-low/50 backdrop-blur-md">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-surface-container-high flex items-center justify-center border border-primary/20">
        <span class="material-symbols-outlined text-primary text-[24px]">shield_locked</span>
      </div>
      <div class="flex flex-col">
        <span class="font-bold text-lg text-on-surface tracking-tight">ScoreVault</span>
        <span class="font-mono text-[10px] text-outline tracking-wider uppercase">Zero-Knowledge Adjudication</span>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <a href="/leaderboard.html" class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-surface-container text-sm font-medium text-on-surface hover:text-primary hover:bg-surface-container-high transition-colors">
        <span class="material-symbols-outlined text-[18px]">trophy</span>
        <span>Public Leaderboard</span>
      </a>
    </div>
  </header>

  <!-- Login Card Section -->
  <main class="flex-1 flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-md">
      <!-- Glow & Card wrapper -->
      <div class="relative">
        <div class="absolute -inset-1 rounded-2xl bg-gradient-to-r from-primary/20 via-secondary/20 to-primary/20 blur-xl opacity-75"></div>
        <div class="relative rounded-2xl bg-surface-container-low border border-surface-container-high/80 p-8 shadow-2xl glow-cyan">
          
          <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-surface-container mb-4 border border-primary/30">
              <span class="material-symbols-outlined text-primary text-[32px]">lock</span>
            </div>
            <h1 class="text-2xl font-bold text-on-surface tracking-tight">Authenticate Access</h1>
            <p class="text-sm text-on-surface-variant mt-1.5">Sign in to your role-based adjudication portal</p>
          </div>

          <!-- Alert feedback box -->
          <div id="alertBox" class="hidden mb-6 p-3.5 rounded-xl text-sm font-medium border flex items-center gap-2"></div>

          <!-- Login Form -->
          <form id="loginForm" class="space-y-5" onsubmit="handleLogin(event)">
            <div>
              <label class="block text-xs font-mono uppercase tracking-wider text-outline mb-2" for="email">Institutional Email</label>
              <div class="relative">
                <span class="material-symbols-outlined absolute left-3.5 top-3 text-outline text-[20px]">mail</span>
                <input id="email" type="email" required
                  placeholder="name@scorevault.in"
                  class="w-full bg-surface-container-lowest border border-surface-container-highest rounded-xl pl-11 pr-4 py-2.5 text-sm text-on-surface placeholder:text-outline/60 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary font-mono transition-all" />
              </div>
            </div>

            <div>
              <label class="block text-xs font-mono uppercase tracking-wider text-outline mb-2" for="password">Security Credential / Passcode</label>
              <div class="relative">
                <span class="material-symbols-outlined absolute left-3.5 top-3 text-outline text-[20px]">key</span>
                <input id="password" type="password" required
                  placeholder="••••••••••••"
                  class="w-full bg-surface-container-lowest border border-surface-container-highest rounded-xl pl-11 pr-4 py-2.5 text-sm text-on-surface placeholder:text-outline/60 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary font-mono transition-all" />
              </div>
            </div>

            <button id="submitBtn" type="submit"
              class="w-full mt-2 py-3 px-4 rounded-xl bg-primary text-on-primary font-semibold text-sm hover:brightness-110 active:scale-[0.99] transition-all flex items-center justify-center gap-2 shadow-lg shadow-primary/20">
              <span class="material-symbols-outlined text-[20px]">login</span>
              <span>Verify & Launch Session</span>
            </button>
          </form>

          <!-- Pre-Seeded Quick Login Accounts -->
          <div class="mt-8 pt-6 border-t border-surface-container-high/60">
            <span class="block text-xs font-mono uppercase tracking-wider text-outline mb-3 text-center">Quick Fill Demo Roles</span>
            <div class="grid grid-cols-3 gap-2">
              <button onclick="fillCredentials('raj@scorevault.in', 'Admin@2026')"
                class="px-2.5 py-2 rounded-lg bg-surface-container hover:bg-surface-container-high border border-surface-container-highest text-left transition-all group">
                <span class="block text-[11px] font-mono text-primary font-semibold">ADMIN</span>
                <span class="block text-[10px] text-outline truncate group-hover:text-on-surface">Raj Singh</span>
              </button>
              <button onclick="fillCredentials('judge1@scorevault.in', 'Judge@2026')"
                class="px-2.5 py-2 rounded-lg bg-surface-container hover:bg-surface-container-high border border-surface-container-highest text-left transition-all group">
                <span class="block text-[11px] font-mono text-secondary font-semibold">JUDGE</span>
                <span class="block text-[10px] text-outline truncate group-hover:text-on-surface">Dr. Vance</span>
              </button>
              <button onclick="fillCredentials('alice@scorevault.in', 'Alice@2026')"
                class="px-2.5 py-2 rounded-lg bg-surface-container hover:bg-surface-container-high border border-surface-container-highest text-left transition-all group">
                <span class="block text-[11px] font-mono text-tertiary font-semibold">PARTICIPANT</span>
                <span class="block text-[10px] text-outline truncate group-hover:text-on-surface">Alice Walker</span>
              </button>
            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="h-12 border-t border-surface-container-high/40 px-6 flex items-center justify-between text-xs text-outline font-mono">
    <span>ScoreVault Adjudication System • Chandigarh University</span>
    <span class="flex items-center gap-1.5 text-secondary">
      <span class="w-1.5 h-1.5 rounded-full bg-secondary animate-pulse"></span>
      HSM Ed25519 Ready
    </span>
  </footer>

  <script>
    function fillCredentials(email, pwd) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = pwd;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submitBtn');
      const alertBox = document.getElementById('alertBox');

      alertBox.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = `<span class="inline-block animate-spin material-symbols-outlined text-[18px]">progress_activity</span> Authenticating...`;

      try {
        const res = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.message || 'Authentication failed. Please verify credentials.');
        }

        // Store JWT token and user info
        sessionStorage.setItem('sv_token', data.token);
        sessionStorage.setItem('sv_user', JSON.stringify(data.user));

        alertBox.className = 'mb-6 p-3.5 rounded-xl text-sm font-medium border border-secondary/40 bg-secondary/10 text-secondary flex items-center gap-2';
        alertBox.innerHTML = `<span class="material-symbols-outlined text-[18px]">check_circle</span> Welcome, ${data.user.fullName}! Redirecting...`;
        alertBox.classList.remove('hidden');

        // Role-based destination
        setTimeout(() => {
          if (data.user.role === 'ADMIN') {
            location.href = '/admin.html';
          } else if (data.user.role === 'JUDGE') {
            location.href = '/judging.html';
          } else if (data.user.role === 'PARTICIPANT') {
            location.href = '/submissions.html';
          } else {
            location.href = '/leaderboard.html';
          }
        }, 600);

      } catch (err) {
        alertBox.className = 'mb-6 p-3.5 rounded-xl text-sm font-medium border border-red-500/40 bg-red-500/10 text-red-400 flex items-center gap-2';
        alertBox.innerHTML = `<span class="material-symbols-outlined text-[18px]">error</span> ${err.message}`;
        alertBox.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = `<span class="material-symbols-outlined text-[20px]">login</span> Verify & Launch Session`;
      }
    }
  </script>
</body>
</html>
