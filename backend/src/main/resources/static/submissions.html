<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Submissions · ScoreVault</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body data-page="submissions">
  <header class="site-header">
    <a class="brand" href="/" aria-label="ScoreVault home"><span class="brand-mark">S</span><span>ScoreVault</span></a>
    <nav class="main-nav" aria-label="Main navigation"><a href="/leaderboard.html">Leaderboard</a><a href="/judging.html">Judge scoring</a><a href="/admin.html">Admin</a><a class="current" href="/participant.html">My team</a></nav>
    <div class="account-area"><span id="account-name"></span><a class="button button-small" id="sign-in-link" href="/login.html">Sign in</a><button class="button button-small button-quiet" id="logout-button" type="button" hidden>Sign out</button></div>
  </header>
  <main class="page-shell">
    <section class="page-heading"><div><p class="eyebrow">Participant workspace</p><h1>My team</h1><p class="muted">Create a team for an open event, invite participant members, and submit a file for each available round.</p></div></section>
    <p id="team-access" class="notice" role="status" aria-live="polite" hidden></p>
    <div id="team-workspace" class="content-grid" hidden>
      <section class="panel">
        <h2>Create your team</h2>
        <form id="team-form" class="form-stack">
          <label for="team-event">Event</label><select id="team-event" required><option value="">Loading events…</option></select>
          <label for="team-name">Team name</label><input id="team-name" maxlength="150" required>
          <label for="team-members">Member emails <span class="muted">(one per line; leave blank for a solo entry)</span></label>
          <textarea id="team-members" rows="5" placeholder="member@university.edu"></textarea>
          <button id="create-team" class="button" type="submit">Create team</button>
          <p id="team-status" class="form-message" role="status" aria-live="polite"></p>
        </form>
      </section>
      <section class="panel">
        <div class="section-heading"><h2>Your teams</h2><button id="refresh-teams" class="button button-small button-secondary" type="button">Refresh</button></div>
        <div id="my-teams"><p class="muted">Loading teams…</p></div>
      </section>
    </div>
  </main>
</body>
</html>
